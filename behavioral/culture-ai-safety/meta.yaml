title: 'Culture Round: AI Safety, Values and Judgment'
title_zh: 文化面：AI 安全、价值观与判断
summary: >-
  A 55-minute onsite conversation about AI-safety judgment: why Anthropic and why safety matters to you, a
  chain of hypothetical dilemmas pressed with follow-ups, a critical read of the company's own published
  safety commitments, personal stories about being persuaded, repairing a relationship, and owning a
  mistake, and a separate read on your character and judgment through lighter, more personal prompts.
summary_zh: "一场 55 分钟的现场对话，考察 AI 安全方面的判断力：为什么是 Anthropic、安全为何对你重要，一连串会被不断追问的假设两难，对公司自身已发布安全承诺的批判性解读，被说服、修复关系、承认错误这类个人故事，以及通过更轻松、更私人化的提问，对你的品格与判断力所做的单独考察。"
