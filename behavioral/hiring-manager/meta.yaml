title: 'Hiring Manager Round: Impact, Collaboration and Growth'
title_zh: 用人经理面：影响力、协作与成长
summary: >-
  A 45-to-55-minute conversation with the hiring manager about how you work: your most impactful project
  and your own role in it, how you prioritize and own outcomes when plans compete for the same time,
  cross-functional collaboration and disagreement, mentoring others and your own growth, and fit with the
  team, closing with the questions you put to the manager.
summary_zh: "一场 45 到 55 分钟、与用人经理进行的对话，考察你的工作方式：最具影响力的项目和你在其中的具体角色、当多项计划争夺同一段时间时你如何排定优先级并对结果负责、跨职能协作与分歧、指导他人与自身成长，以及与团队的匹配度，最后是你向经理提出的问题。"
category: behavioral
kind: Behavioral
kind_zh: 行为面
roles: [All]
topics: [impact, ownership, collaboration, cross-functional, mentorship, roadmap-influence]
frequency: very-high
stage: [hm-screen, onsite]
format: 55 min
order: 3
